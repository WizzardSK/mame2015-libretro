name: preflight (macOS/iOS/tvOS)
on: [push, workflow_dispatch]

jobs:
  apple:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: osx,        core: cdi2015_libretro.dylib,      vtool: MACOS }
          - { platform: ios-arm64,  core: cdi2015_libretro_ios.dylib,  vtool: IOS }
          - { platform: tvos-arm64, core: cdi2015_libretro_tvos.dylib, vtool: TVOS }
    runs-on: macos-15
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - run: uname -a; clang --version | head -n1
      - name: build, with the variables the buildbot job sets
        env:
          platform: ${{ matrix.platform }}
          CC: clang
          CXX: clang++
        run: make -f Makefile SUBTARGET=cdi platform=${{ matrix.platform }} -j$(sysctl -n hw.ncpu) > build.log 2>&1 || (tail -n 60 build.log; exit 1)
      - name: the core is arm64 and stamped for the right platform
        run: |
          ls -la ${{ matrix.core }}
          lipo -info ${{ matrix.core }}
          lipo -info ${{ matrix.core }} | grep -q arm64
          vtool -show ${{ matrix.core }} | grep -E 'platform|minos' || true
          vtool -show ${{ matrix.core }} | grep -q '${{ matrix.vtool }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ matrix.platform }}
          path: build.log

  # armv7 cannot be built here - Xcode 14 dropped it and the runners have 15
  # and 16 - so this checks the wiring the ios9 job depends on.
  ios9-wiring:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: what the ios9 job would compile with
        run: |
          make -f Makefile -n platform=ios9 SUBTARGET=cdi 2>/dev/null | grep -m1 -- '-c src/' | tee dry.txt
          grep -q -- '-arch armv7' dry.txt
          grep -q -- '-miphoneos-version-min=9.0' dry.txt
          grep -q -- '-isysroot .*iPhoneOS' dry.txt
          ! grep -q -- '-DPTR64' dry.txt
          echo "ios9 flags are 32-bit armv7 against the iPhoneOS SDK"
